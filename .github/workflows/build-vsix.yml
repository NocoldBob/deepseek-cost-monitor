name: build-vsix

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-vsix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: vsix-windows
          - os: ubuntu-22.04
            label: Ubuntu 22.04
            artifact: vsix-ubuntu-22.04
          - os: ubuntu-24.04
            label: Ubuntu 24.04
            artifact: vsix-ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scenario checks
        run: node tools/scenario_check.js

      - name: Package VSIX
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 30
